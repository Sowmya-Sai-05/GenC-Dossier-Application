# =============================================================================
# Azure App Service profile
# =============================================================================
# Activate with: SPRING_PROFILES_ACTIVE=azure (set in Azure App Service > Configuration)
# All sensitive values MUST be set as Azure App Settings (environment variables).
# =============================================================================

# ─── Database (Azure Database for MySQL Flexible Server) ─────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ─── CORS ────────────────────────────────────────────────────────────────────
# Set CORS_ALLOWED_ORIGINS in Azure App Settings to your Static Web App URL
# e.g., https://your-frontend-app.azurestaticapps.net
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ─── File uploads ────────────────────────────────────────────────────────────
file.upload-dir=${FILE_UPLOAD_DIR:/home/site/uploads}

# ─── Swagger (disable in production) ────────────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ─── Debug Logging ───────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.cts=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=C:/home/LogFiles/spring.log
